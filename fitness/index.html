  --text-lg:clamp(1.125rem,1rem + .75vw,1.5rem);
  --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;--space-5:1.25rem;
  --space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;--space-12:3rem;
  --bg:oklch(97.5% .006 95);--surface:oklch(99.5% .003 95);--sunk:oklch(94.5% .008 95);
  --line:oklch(89% .01 95);--ink:oklch(24% .015 250);--muted:oklch(50% .015 250);
  --accent:oklch(46% .09 165);--accent-soft:oklch(93% .035 165);
  --ok:oklch(52% .13 150);--ok-soft:oklch(94% .045 150);
  --warn:oklch(60% .13 75);--warn-soft:oklch(95% .05 85);
  --bad:oklch(52% .17 27);--bad-soft:oklch(94% .04 27);
  --a1:oklch(55% .11 165);--a2:oklch(62% .12 250);--a3:oklch(68% .13 75);--a4:oklch(58% .14 320);
  --a5:oklch(60% .12 30);--a6:oklch(70% .02 250);--a7:oklch(50% .04 250);
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"General Sans",ui-sans-serif,system-ui,sans-serif;
  font-size:var(--text-base);line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums lining-nums}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding:var(--space-8) var(--space-6) var(--space-12)}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--space-4);
  padding-bottom:var(--space-6);border-bottom:1px solid var(--line);margin-bottom:var(--space-6)}
.eyebrow{font-size:var(--text-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-size:var(--text-xl);font-weight:600;margin:var(--space-1) 0 0;letter-spacing:-.01em;line-height:1.15}
h2{font-size:var(--text-lg);font-weight:600;margin:0 0 var(--space-4);letter-spacing:-.005em}
.stamp{font-size:var(--text-sm);color:var(--muted);text-align:right}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-4);margin-bottom:var(--space-8)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-4) var(--space-5)}
.kpi .label{font-size:var(--text-xs);color:var(--muted);font-weight:500}
.kpi .value{font-size:var(--text-xl);font-weight:600;line-height:1.1;margin-top:var(--space-2)}
.kpi .sub{font-size:var(--text-xs);color:var(--muted);margin-top:var(--space-1)}
.kpi.bad .value{color:var(--bad)}.kpi.warn .value{color:var(--warn)}.kpi.ok .value{color:var(--ok)}
section{margin-bottom:var(--space-10)}
.grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:var(--space-6)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-5) var(--space-6)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:var(--space-3);padding:var(--space-3) 0;border-top:1px solid var(--line);font-size:var(--text-sm)}
.list li:first-child{border-top:0;padding-top:0}
.tag{flex:none;font-size:var(--text-xs);font-weight:600;padding:0 var(--space-2);border-radius:999px;
  background:var(--sunk);color:var(--ink);height:1.5rem;line-height:1.5rem;white-space:nowrap}
.empty{color:var(--muted);font-size:var(--text-sm)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-xs);font-weight:600;
  padding:2px var(--space-2);border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:oklch(48% .11 70)}
.p-bad{background:var(--bad-soft);color:var(--bad)}.p-none{background:var(--sunk);color:var(--muted)}
.tablewrap{overflow-x:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:var(--text-sm)}
th{font-size:var(--text-xs);font-weight:600;color:var(--muted);text-align:left;padding:var(--space-3) var(--space-4);
  border-bottom:1px solid var(--line);background:var(--sunk);position:sticky;top:0}
td{padding:var(--space-3) var(--space-4);border-top:1px solid var(--line);vertical-align:top}
tr:first-child td{border-top:0}
.repo b{display:block;font-weight:600}.repo span{font-size:var(--text-xs);color:var(--muted)}
.owner{font-size:var(--text-xs);color:var(--muted);max-width:180px}
.owner.me{color:var(--accent);font-weight:600}
.spark{display:block}
.legend{display:flex;flex-wrap:wrap;gap:var(--space-4);font-size:var(--text-xs);color:var(--muted);margin-top:var(--space-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.bars .row{display:grid;grid-template-columns:90px 1fr 40px;align-items:center;gap:var(--space-3);margin:var(--space-2) 0;font-size:var(--text-sm)}
.bar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.bar span{display:block;height:100%}
.pins .row{display:grid;grid-template-columns:150px 1fr auto;gap:var(--space-3);align-items:center;padding:var(--space-3) 0;border-top:1px solid var(--line);font-size:var(--text-sm)}
.pins .row:first-child{border-top:0;padding-top:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--text-xs)}
.muted{color:var(--muted)}
details{border-top:1px solid var(--line);padding:var(--space-3) 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600;font-size:var(--text-sm);list-style:none;display:flex;justify-content:space-between;gap:var(--space-3)}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted)}
details[open] summary::after{content:"–"}
details ul{margin:var(--space-3) 0 0;padding-left:var(--space-5);font-size:var(--text-sm)}
details li{margin:var(--space-1) 0}
.gate{color:oklch(48% .11 70);font-weight:600;font-size:var(--text-xs);margin-left:6px}
.owners{display:grid;grid-template-columns:1fr;gap:var(--space-4)}
.owners div{font-size:var(--text-sm)}.owners b{display:block;font-size:var(--text-sm)}
footer{font-size:var(--text-xs);color:var(--muted);border-top:1px solid var(--line);padding-top:var(--space-4)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.owners{grid-template-columns:1fr}
  .pins .row{grid-template-columns:1fr auto}.pins .row .mid{grid-column:1/-1;order:3}}
@media (max-width:480px){.wrap{padding:var(--space-5) var(--space-4) var(--space-10)}.kpi .value{font-size:var(--text-lg)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="eyebrow">Fitness-Komplex</div>
      <h1>Fitness-Komplex · Lage</h1>

  <div class="kpis" id="kpis"></div>

  <section class="grid2">
    <div class="card">
      <h2>Braucht Owner-Entscheid</h2>
      <ul class="list" id="gates"></ul>
    </div>
    <div class="card">
      <h2>Ausnahmen</h2>
      <ul class="list" id="exceptions"></ul>
    </div>
  </section>

  <section>
    <h2>Repos</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>App</th><th>Zuständig</th><th>CI</th><th>Live</th><th>Shell-Pin</th><th>Issues · PRs</th><th>Alerts</th><th>Commits 14 T</th><th>Letzter Push</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>

  <section class="grid2">
    <div class="card">
      <h2>Pin-Kette</h2>
      <div class="pins" id="pins"></div>
    </div>
    <div class="card">
      <h2>Wer arbeitet · 7 Tage</h2>
      <div class="bars" id="bars"></div>
      <div class="legend" id="legend"></div>
    </div>
  </section>

  <section class="card">
    <h2>Offene Punkte je App</h2>
    <div id="items"></div>
  </section>

  <section class="card">
    <h2>Zuständigkeiten</h2>
    <div class="owners" id="owners"></div>
  </section>

  <footer id="foot"></footer>
</div>

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = iso => iso ? new Date(iso).toLocaleString("de-AT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Vienna"}) : "–";
const ago = iso => { if(!iso) return "–"; const h=(Date.now()-new Date(iso))/36e5; return h<1?"vor <1 h":h<48?`vor ${Math.round(h)} h`:`vor ${Math.round(h/24)} T`; };
const ME = "CTO (Cloud) + Staff";

$("stamp").innerHTML = `KW ${D.week} · Stand ${fmt(D.generated_at)}<br><span class="muted">wöchentlich, nur Zähler und Status</span>`;

const R = D.repos;
const ciGreen = R.filter(r=>r.ci==="green").length;
const ciRed = R.filter(r=>r.ci==="red");
const live = R.filter(r=>r.live);
const liveOk = live.filter(r=>r.live_status && r.live_status<400).length;
const drift = D.links.filter(l=>l.state==="drift");
const commits7 = R.reduce((a,r)=>a+r.commits_7d,0);
const kpis = [
  {l:"CI grün", v:`${ciGreen}/${R.length}`, s: ciRed.length?`${ciRed.length} rot`: (R.some(r=>r.ci==="running")?"Läufe offen":"alle Pipelines"), c: ciRed.length?"bad":ciGreen===R.length?"ok":"warn"},
  {l:"Live erreichbar", v:`${liveOk}/${live.length}`, s:"Firebase Hosting", c: liveOk===live.length?"ok":"bad"},
  {l:"Pin-Drift", v:String(drift.length), s:`${D.links.length} Kopplungen geprüft`, c: drift.length?"warn":"ok"},
  {l:"Owner-Gates offen", v:String(D.gate_count), s:"Anzahl, ohne Text", c: D.gate_count?"warn":"ok"},
  {l:"Commits 7 Tage", v:String(commits7), s:"alle Fitness-Repos", c:""},
];
$("kpis").innerHTML = kpis.map(k=>`<div class="kpi ${k.c}"><div class="label">${k.l}</div><div class="value num">${k.v}</div><div class="sub">${k.s}</div></div>`).join("");

const gateRows = R.filter(r=>r.gate_count);
$("gates").innerHTML = gateRows.length ? gateRows.map(r=>`<li><span class="tag">${esc(r.label)}</span><span class="num">${r.gate_count} offen</span></li>`).join("") : `<li class="empty">Keine offenen Gate-Punkte.</li>`;

const ex = [];
ciRed.forEach(r=>ex.push({t:r.label,h:`CI rot${r.ci_failed?` · ${r.ci_failed}`:""}`}));

const pill = (cls,txt)=>`<span class="pill ${cls}">${txt}</span>`;
const ciPill = s => ({green:pill("p-ok","grün"),red:pill("p-bad","rot"),running:pill("p-warn","läuft"),none:pill("p-none","keine")}[s]);
const livePill = r => !r.live ? `<span class="muted">–</span>` : (r.live_status && r.live_status<400 ? pill("p-ok",`<a href="${r.live}">${r.live_status}</a>`) : pill("p-bad",`<a href="${r.live}">${r.live_status||"aus"}</a>`));
const pinOf = r => { const l = D.links.find(l=>l.path===r.pin && l.source.includes("vitalos")); if(!l) return `<span class="muted">–</span>`;
  return l.state==="ok"?pill("p-ok","aktuell"):l.state==="docs"?pill("p-ok",`+${l.behind} Doku`):l.state==="deps"?pill("p-ok",`+${l.behind} Lockfile`):l.state==="drift"?pill("p-warn",`${l.behind} zurück`):pill("p-none","?"); };
const spark = arr => { const w=112,h=26,m=Math.max(1,...arr),bw=w/arr.length;
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Commits pro Tag, 14 Tage">`+
  arr.map((v,i)=>`<rect x="${(i*bw+1).toFixed(1)}" y="${(h-(v/m)*(h-2)-1).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${((v/m)*(h-2)+1).toFixed(1)}" rx="1" fill="${i>=7?"var(--accent)":"var(--a6)"}"><title>${v}</title></rect>`).join("")+`</svg>`; };
$("rows").innerHTML = R.map(r=>`<tr>
  <td class="repo"><b>${esc(r.label)}</b><span>${esc(r.role)}</span></td>
  <td class="owner ${r.owner.startsWith(ME)?"me":""}">${esc(r.owner)}</td>
  <td>${ciPill(r.ci)}</td><td>${livePill(r)}</td><td>${pinOf(r)}</td>
  <td class="num">${r.issue_count} · ${r.pr_count}</td>
  <td class="num">${r.alerts==null?"–":r.alerts}</td>

  const st = l.state==="ok"?pill("p-ok","synchron"):l.state==="docs"?pill("p-ok","nur Doku"):l.state==="deps"?pill("p-ok","nur Lockfile"):l.state==="drift"?pill("p-warn","Code-Drift"):pill("p-none","unbekannt");

const AG = ["Perplexity Computer","Claude (Laptop)","Cursor","Codex","Vibe","Laptop ohne Trailer","Bots"];
const AC = ["var(--a1)","var(--a2)","var(--a3)","var(--a4)","var(--a5)","var(--a7)","var(--a6)"];
const maxC = Math.max(1,...R.map(r=>r.commits_7d));
$("bars").innerHTML = R.map(r=>`<div class="row"><span>${esc(r.label)}</span><div class="bar" style="width:${Math.max(4,r.commits_7d/maxC*100)}%">${
  AG.map((a,i)=>r.agents_7d[a]?`<span style="width:${r.agents_7d[a]/r.commits_7d*100}%;background:${AC[i]}" title="${a}: ${r.agents_7d[a]}"></span>`:"").join("")}</div><span class="num muted">${r.commits_7d}</span></div>`).join("");
const used = AG.filter(a=>R.some(r=>r.agents_7d[a]));
$("legend").innerHTML = used.map(a=>`<span><i style="background:${AC[AG.indexOf(a)]}"></i>${a}</span>`).join("");

$("items").innerHTML = R.map(r=>{ if(!r.item_count && !r.issue_count && !r.pr_count) return "";
  return `<div class="row" style="display:grid;grid-template-columns:140px 1fr;gap:var(--space-2);padding:4px 0"><b>${esc(r.label)}</b><span class="muted num">${r.item_count} Punkte · ${r.issue_count} Issues · ${r.pr_count} PRs${r.gate_count?` · ${r.gate_count} Gates`:""}</span></div>`; }).join("") || `<p class="empty">Keine offenen Zähler.</p>`;

$("owners").innerHTML = Object.entries(D.owners).map(([k,v])=>`<div><b class="${k===ME?"":""}" style="${k===ME?"color:var(--accent)":""}">${esc(k)}</b><span class="muted">${esc(v)}</span></div>`).join("");
$("foot").innerHTML = `Öffentliche Lage: Zähler und Status, keine Titel. Wöchentlich gebaut von GitHub Actions, gehostet auf <span class="mono">vos-dashboard.web.app</span>. Generator: <span class="mono">vos/fitness/dashboard/build.py</span>.`;
</script>
</body>
</html>
