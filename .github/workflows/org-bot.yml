name: Org-Bot (PR anlegen & mergen)

# Vorlage v2 (24.11.2026): nimmsel23/vos cto/tools/org-bot.yml.
# Gehört zusammen mit .github/scripts/org-bot-classify.sh (Vorlage
# cto/tools/org-bot-classify.sh). Nicht von Hand pro Repo ändern: Vorlage
# ändern, dann verteilen. Der Org-Sweep in vos meldet abweichende Kopien.
#
# Org-Autonomie + Merge-Klassen: org/DECISIONS/2026-11-16-merge-klassen.md
# Seit 24.11.2026 (Daniel): keine Zweitfreigabe, Merge sobald Checks grün.
# Braucht: Repo-Variable ORG_BOT_APP_ID, Secret ORG_BOT_PRIVATE_KEY.
# Optional: Repo-Variable ORG_BOT_MODE = docs (Default) | code.
# Ohne ORG_BOT_APP_ID tut der Workflow nichts.
#
# Sicherheit: pull_request_target läuft in der Version des Default-Branches.
# Der PR-Code wird nie ausgecheckt oder ausgeführt; gelesen wird nur die
# Dateiliste über die API. Das Klassifikationsskript kommt aus dem Default-Branch.
#
# Sweep zweimal stündlich (:17, :47) und per repository_dispatch vom Org-Sweep: jeder offene Agenten-PR wird neu bewertet. So
# bleibt kein grüner PR liegen, nur weil ein Event gefehlt hat, und PRs hinter
# der Basis bekommen die Basis nachgezogen.

on:
  push:
    branches: ["codex/**", "vibe/**", "claude/**", "research/**", "orch/**"]
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, ready_for_review]
  check_suite:
    types: [completed]
  check_run:
    types: [completed]
  schedule:
    # Zwei Slots abseits der vollen Stunde: GitHub verwirft volle-Stunde-Slots
    # in diesen Repos oft (vitalos ":20" lief seit 17.11. nur zweimal).
    - cron: "17,47 * * * *"
  # Der Org-Sweep in vos stößt hier an, falls ein Zeitplan-Slot ausfällt.
  repository_dispatch:
    types: [org-bot-sweep]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: org-bot-${{ github.event.pull_request.number || github.event.check_suite.head_sha || github.event.check_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  open-pr:
    if: github.event_name == 'push' && vars.ORG_BOT_APP_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.ORG_BOT_APP_ID }}
          private-key: ${{ secrets.ORG_BOT_PRIVATE_KEY }}
      - name: PR anlegen, falls noch keiner offen ist
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.event.repository.default_branch }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          open=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number -q 'length')
          [ "$open" = "0" ] || { echo "PR existiert bereits."; exit 0; }
          ahead=$(gh api "repos/$REPO/compare/$BASE...$BRANCH" -q '.ahead_by')
          [ "$ahead" -gt 0 ] || { echo "Branch liegt nicht vor $BASE."; exit 0; }
          title=$(printf '%s\n' "$MSG" | sed -n '1p')
          [ -n "$title" ] || title="$BRANCH"
          gh pr create -R "$REPO" --head "$BRANCH" --base "$BASE" --title "$title" \
            --body "Automatisch vom Org-Bot angelegt (Branch \`$BRANCH\`). Klasse und Merge: siehe org/DECISIONS/2026-11-16-merge-klassen.md in vos."

  classify-merge:
    if: >-
      vars.ORG_BOT_APP_ID != '' &&
      (
        (github.event_name == 'pull_request_target' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         !github.event.pull_request.draft) ||
        (github.event_name == 'check_suite' && github.event.check_suite.app.slug != 'github-actions' &&
         github.event.check_suite.head_branch != github.event.repository.default_branch) ||
        (github.event_name == 'check_run' && github.event.check_run.app.slug != 'github-actions' &&
         github.event.check_run.check_suite.head_branch != github.event.repository.default_branch) ||
        github.event_name == 'schedule' ||
        github.event_name == 'repository_dispatch' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.ORG_BOT_APP_ID }}
          private-key: ${{ secrets.ORG_BOT_PRIVATE_KEY }}
      - name: Klassifikation aus dem Default-Branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Klasse bestimmen und handeln
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ vars.ORG_BOT_MODE || 'docs' }}
          EVENT: ${{ github.event_name }}
          ONE_PR: ${{ github.event.pull_request.number || '' }}
          HEAD_SHA: ${{ github.event.check_suite.head_sha || github.event.check_run.head_sha || '' }}
        run: |
          set -euo pipefail
          if [ -n "$ONE_PR" ]; then
            prs="$ONE_PR"
          elif [ -n "$HEAD_SHA" ]; then
            prs="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" -q '.[] | select(.state=="open") | .number')"
          else
            prs="$(gh pr list -R "$REPO" --state open --limit 100 --json number,isDraft -q '.[] | select(.isDraft==false) | .number')"
          fi
          [ -n "$prs" ] || { echo "Kein offener PR."; exit 0; }
          while IFS= read -r pr; do
            [ -n "$pr" ] || continue
            echo "=== PR #${pr} ==="
            PR="$pr" bash .github/scripts/org-bot-classify.sh || { echo "::warning::PR #${pr}: Klassifikation fehlgeschlagen."; }
          done <<< "$prs"
          exit 0
